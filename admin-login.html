<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login | Saint Laurent Gaseke TSS</title>
  <link rel="stylesheet" href="shared.css"/>
  <link rel="stylesheet" href="admin-login.css"/>
  <script src="theme.js"></script>
</head>
<body class="admin-login-page">

<div class="top-ribbon">
  <div class="container ribbon-inner">
    <span class="ribbon-left">Gicumbi District &mdash; Northern Province, Rwanda</span>
    <span class="ribbon-right">
      <a href="index.html">Back to Website</a>
    </span>
  </div>
</div>

<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <div class="login-logo">
        <div class="logo-crest">SLG</div>
        <h1>Saint Laurent Gaseke TSS</h1>
        <p>Admin Portal</p>
      </div>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="ihirweenzo@yahoo.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="login-btn">Sign In</button>

      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>
    </form>

    <div class="login-footer">
      <p>Secure admin access only</p>
      <p class="connection-status">
        <span id="statusIndicator" class="status-dot"></span>
        <span id="statusText">Checking connection...</span>
      </p>
    </div>
  </div>
</div>


<script src="api.js"></script>
<script>
  // Check backend connection on page load
  async function checkConnection() {
    const statusDot = document.getElementById('statusIndicator');
    const statusText = document.getElementById('statusText');
    
    try {
      const result = await checkHealthStatus();
      if (result) {
        statusDot.classList.add('connected');
        statusText.textContent = '✓ Backend connected';
      } else {
        throw new Error('No response');
      }
    } catch (error) {
      statusDot.classList.add('disconnected');
      statusText.textContent = '✗ Backend offline';
    }
  }

  // Check connection when page loads
  window.addEventListener('load', checkConnection);

  // Handle login form submission
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    errorMsg.textContent = '';
    successMsg.textContent = '';

    if (!email || !password) {
      errorMsg.textContent = '⚠️ Please enter both email and password';
      return;
    }

    try {
      const result = await adminLogin(email, password);

      if (result.success) {
        successMsg.textContent = '✓ Login successful! Redirecting...';
        setTimeout(() => {
          window.location.href = 'admin-dashboard.html';
        }, 1500);
      } else {
        errorMsg.textContent = `❌ ${result.message || 'Login failed'}`;
      }
    } catch (error) {
      errorMsg.textContent = `❌ ${error.message || 'Login failed. Please try again.'}`;
    }
  });
</script>

</body>
</html>
