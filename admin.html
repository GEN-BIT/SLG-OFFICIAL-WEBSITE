<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - St. Laurent</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 10px; margin-bottom: 10px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background: #0056b3; }
    .hidden { display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    #loginError { color: red; }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; }
    .logout-btn { width: auto; background: #dc3545; }
  </style>
</head>
<body>
  <div class="container">
    <h2>St. Laurent Admin Dashboard</h2>
    
    <!-- Login Section -->
    <div id="loginSection">
      <h3>Login</h3>
      <input type="email" id="email" placeholder="Email" value="admin@stlaurent.com">
      <input type="password" id="password" placeholder="Password" value="admin123">
      <button onclick="login()">Login</button>
      <p id="loginError"></p>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="hidden">
      <div class="dashboard-header">
        <h3>Enrollments & Contacts</h3>
        <button onclick="logout()" class="logout-btn">Logout</button>
      </div>
      
      <h4>Recent Enrollments</h4>
      <table id="enrollmentsTable">
        <thead><tr><th>Student</th><th>Grade</th><th>Email</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table>

      <h4>Recent Contact Messages</h4>
      <table id="contactsTable">
        <thead><tr><th>Name</th><th>Subject</th><th>Email</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('token');

    if (token) showDashboard();

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (res.ok) {
          token = data.token;
          localStorage.setItem('token', token);
          showDashboard();
        } else {
          document.getElementById('loginError').innerText = data.message;
        }
      } catch (err) { alert('Connection failed'); }
    }

    function logout() {
      localStorage.removeItem('token');
      location.reload();
    }

    async function showDashboard() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      
      await loadEnrollments();
      await loadContacts();
    }

    async function loadEnrollments() {
      const res = await fetch('http://localhost:5000/api/enrollments', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) return logout();
      const data = await res.json();
      const tbody = document.querySelector('#enrollmentsTable tbody');
      tbody.innerHTML = data.map(e => `
        <tr>
          <td>${e.studentName}</td>
          <td>${e.gradeApplying}</td>
          <td>${e.email}</td>
          <td>${e.status}</td>
        </tr>
      `).join('');
    }

    async function loadContacts() {
      const res = await fetch('http://localhost:5000/api/contact', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) return logout();
      const data = await res.json();
      const tbody = document.querySelector('#contactsTable tbody');
      tbody.innerHTML = data.map(c => `
        <tr>
          <td>${c.name}</td>
          <td>${c.subject}</td>
          <td>${c.email}</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
